<figure class="fluxo" aria-label="Fluxograma: como a lei responde no caso do hotel">
<svg viewBox="0 0 640 330" width="100%" font-family="Poppins, sans-serif" font-size="12.5" role="img">
<title>Como a lei responde: defeito, culpa exclusiva e culpa concorrente</title>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5d5a55"/></marker></defs>
<g stroke="#5d5a55" stroke-width="1.6" fill="none" marker-end="url(#ar)"><path d="M170 58 V88"/><path d="M170 140 V170"/><path d="M170 222 V252"/><path d="M300 32 H392"/><path d="M300 114 H392"/><path d="M300 196 H392"/></g>
<g font-size="11" fill="#5d5a55" font-weight="600"><text x="178" y="78">sim</text><text x="178" y="160">não</text><text x="178" y="242">sim</text><text x="330" y="26">não</text><text x="330" y="108">sim</text><text x="330" y="190">não</text></g>
<rect x="40" y="6" width="260" height="52" rx="10" fill="#25383d"/><text x="170" y="28" fill="#f7f2ea" text-anchor="middle" font-weight="600">A estrutura tinha defeito? Faltou</text><text x="170" y="45" fill="#f7f2ea" text-anchor="middle" font-weight="600">a segurança que se podia esperar?</text>
<rect x="40" y="88" width="260" height="52" rx="10" fill="#25383d"/><text x="170" y="110" fill="#f7f2ea" text-anchor="middle" font-weight="600">Havia defeito. A conduta dela foi</text><text x="170" y="127" fill="#f7f2ea" text-anchor="middle" font-weight="600">a causa exclusiva da queda?</text>
<rect x="40" y="170" width="260" height="52" rx="10" fill="#25383d"/><text x="170" y="192" fill="#f7f2ea" text-anchor="middle" font-weight="600">A conduta dela também</text><text x="170" y="209" fill="#f7f2ea" text-anchor="middle" font-weight="600">contribuiu para a queda?</text>
<rect x="40" y="252" width="260" height="64" rx="10" fill="#fbf3d6" stroke="#f2c230" stroke-width="2"/><text x="170" y="276" text-anchor="middle" font-weight="700">O hotel indeniza, mas o valor</text><text x="170" y="293" text-anchor="middle" font-weight="700">é reduzido conforme a contribuição</text><text x="170" y="309" text-anchor="middle" fill="#5d5a55" font-size="11">CC, art. 945 · não é meio a meio automático</text>
<rect x="392" y="6" width="240" height="52" rx="10" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/><text x="512" y="28" text-anchor="middle" font-weight="700">Hotel não responde</text><text x="512" y="45" text-anchor="middle" fill="#5d5a55" font-size="11">sem defeito · CDC, art. 14, § 3º</text>
<rect x="392" y="88" width="240" height="52" rx="10" fill="#e6f2ea" stroke="#2e7d4f" stroke-width="1.5"/><text x="512" y="110" text-anchor="middle" font-weight="700">Hotel não responde</text><text x="512" y="127" text-anchor="middle" fill="#5d5a55" font-size="11">culpa exclusiva da vítima · § 3º</text>
<rect x="392" y="170" width="240" height="52" rx="10" fill="#e9f0f8" stroke="#1d4e89" stroke-width="1.5"/><text x="512" y="192" text-anchor="middle" font-weight="700">Hotel indeniza integralmente</text><text x="512" y="209" text-anchor="middle" fill="#5d5a55" font-size="11">CDC, art. 14, caput</text>
<text x="420" y="270" font-size="11.5" fill="#1f1f1f" font-weight="600">Hoje, cada pergunta</text><text x="420" y="287" font-size="11.5" fill="#1f1f1f" font-weight="600">depende do laudo da perícia.</text>
</svg></figure>
